<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日打者 VS 先發投手 — MLB 對戰數據</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Teko:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EFE6D5;
    --line:#C9BFA8;
    --card:#F8F3E7;
    --ink:#211C18;
    --red:#DC2626;
    --blue:#24487A;
    --gold:#D9A62B;
    --green:#15803D;
    --grey:#8A8272;
    --font-display:'Teko', sans-serif;
    --font-body:'Inter', sans-serif;
    --font-mono:'Courier Prime', monospace;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}

  body{
    background:
      repeating-linear-gradient(var(--paper), var(--paper) 27px, var(--line) 28px),
      var(--paper);
    color:var(--ink);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
    padding:36px 16px 80px;
    min-height:100vh;
  }

  .wrap{max-width:720px;margin:0 auto;}

  header{text-align:center;margin-bottom:22px;}
  .eyebrow{
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--blue);
    margin-bottom:8px;
  }
  h1{
    font-family:var(--font-display);
    font-weight:600;
    font-size:clamp(24px,8vw,48px);
    letter-spacing:.01em;
    line-height:1;
    margin:0 0 10px;
    text-transform:uppercase;
    white-space:nowrap;
  }
  h1 em{font-style:normal;color:var(--red);}
  .sub{
    font-size:14px;
    color:#5b5648;
    max-width:460px;
    margin:0 auto;
    line-height:1.6;
  }

  /* ---------- Date bar ---------- */
  .datebar{
    display:flex;align-items:center;justify-content:center;gap:8px;
    margin:22px 0 20px;
  }
  .datebar button{
    border:1.5px solid var(--ink);background:var(--card);color:var(--ink);
    width:36px;height:36px;border-radius:6px;font-size:18px;cursor:pointer;
    font-family:var(--font-display);
  }
  .datebar button:hover{background:#fff;}
  .datebar button:focus-visible{outline:2px solid var(--blue);outline-offset:2px;}
  #date-input{
    border:1.5px solid var(--ink);background:#fff;color:var(--ink);
    border-radius:6px;padding:8px 10px;font-family:var(--font-mono);font-size:13px;
  }
  #today-btn{
    width:auto;padding:0 14px;font-family:var(--font-body);font-weight:600;font-size:13px;
  }

  /* ---------- Batter lookup ---------- */
  .lookup-card{
    background:var(--card);border:1.5px solid var(--ink);border-radius:8px;
    box-shadow:0 3px 0 rgba(0,0,0,.1);padding:16px 18px 18px;margin-bottom:24px;
  }
  .lookup-label{
    font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--blue);margin-bottom:9px;display:block;
  }
  .name-search-row{display:flex;gap:8px;align-items:stretch;}
  .name-search{position:relative;flex:1;min-width:0;}
  #batter-search{
    width:100%;border:1.5px solid var(--ink);border-radius:4px;background:#fff;
    font-family:var(--font-body);font-size:14px;padding:10px 10px;color:var(--ink);
  }
  #batter-reset{
    flex:0 0 auto;
    border:1.5px solid var(--ink);border-radius:4px;background:var(--paper);color:var(--ink);
    font-family:var(--font-mono);font-size:12px;font-weight:600;letter-spacing:.04em;
    padding:0 16px;cursor:pointer;
  }
  #batter-reset:hover{background:#fff;}
  #batter-reset:focus-visible{outline:2px solid var(--blue);outline-offset:2px;}
  #batter-search:focus{outline:2px solid var(--blue);outline-offset:1px;}
  .suggest{
    position:absolute;top:calc(100% + 4px);left:0;right:0;
    background:#fff;border:1.5px solid var(--ink);border-radius:4px;
    box-shadow:0 4px 8px rgba(0,0,0,.15);
    z-index:20;max-height:230px;overflow-y:auto;display:none;
  }
  .suggest.active{display:block;}
  .suggest-item{padding:9px 12px;font-size:13px;cursor:pointer;display:flex;justify-content:space-between;gap:8px;align-items:baseline;}
  .suggest-item:hover{background:var(--paper);}
  .suggest-item .s-pos{font-family:var(--font-mono);font-size:11px;color:var(--grey);flex:0 0 auto;}
  #batter-result{margin-top:14px;}
  .batter-result-head{font-size:13px;color:#4a4536;margin-bottom:10px;}

  /* ---------- States ---------- */
  .state-box{text-align:center;padding:40px 20px;color:var(--grey);font-size:13px;font-family:var(--font-mono);}
  .state-box.error{color:var(--red);}
  .state-box button{
    margin-top:12px;background:none;border:1.5px solid var(--ink);color:var(--ink);
    font-family:var(--font-body);font-weight:600;font-size:13px;
    padding:8px 16px;border-radius:999px;cursor:pointer;
  }
  .runway{position:relative;height:2px;background:var(--line);margin:0 auto 16px;max-width:220px;}
  .ball{position:absolute;top:-9px;left:0;font-size:18px;animation:pitch 1.2s ease-in-out infinite;}
  @keyframes pitch{
    0%{left:0;transform:rotate(0deg);opacity:0;}
    12%{opacity:1;} 88%{opacity:1;}
    100%{left:calc(100% - 18px);transform:rotate(360deg);opacity:0;}
  }
  @media (prefers-reduced-motion: reduce){ .ball{animation:none;left:calc(50% - 9px);opacity:1;} }

  /* ---------- Game card ---------- */
  .game-card{
    background:var(--card);
    border:1.5px solid var(--ink);
    border-radius:8px;
    box-shadow:0 3px 0 rgba(0,0,0,.1);
    margin-bottom:16px;
    overflow:hidden;
  }
  .game-head{
    display:flex;justify-content:space-between;align-items:center;
    padding:9px 16px;border-bottom:1.5px solid var(--ink);
    font-family:var(--font-mono);font-size:11px;letter-spacing:.05em;color:var(--grey);
  }
  .g-time-et{opacity:.65;}
  .g-status{
    padding:2px 8px;border-radius:3px;background:var(--paper);color:var(--ink);font-weight:600;
  }
  .g-status.live{background:var(--green);color:#fff;}
  .g-status.final{background:var(--ink);color:#fff;}

  .matchup-row{display:flex;align-items:stretch;gap:0;}
  .pitcher-btn{
    flex:1;min-width:0;
    background:none;border:none;cursor:pointer;
    padding:14px 12px;text-align:center;
    display:flex;flex-direction:column;gap:3px;
    font-family:var(--font-body);color:var(--ink);
    border-bottom:3px solid transparent;
  }
  .pitcher-btn:hover{background:rgba(255,255,255,.5);}
  .pitcher-btn:focus-visible{outline:2px solid var(--blue);outline-offset:-2px;}
  .pitcher-btn.active{background:#fff;border-bottom-color:var(--gold);}
  .pitcher-btn:disabled{cursor:default;opacity:.5;}
  .pitcher-btn .team-name{font-size:11px;font-family:var(--font-mono);letter-spacing:.05em;color:var(--blue);text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .pitcher-btn .p-label{font-size:10px;color:var(--grey);}
  .pitcher-btn .pitcher-name{font-family:var(--font-display);font-size:20px;font-weight:600;line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .matchup-row .at{
    display:flex;align-items:center;justify-content:center;
    font-family:var(--font-mono);font-size:11px;color:var(--grey);padding:0 4px;
  }

  /* ---------- Matchup panel ---------- */
  .matchup-panel{border-top:1.5px dashed var(--line);padding:14px 16px 16px;}
  .panel-title{font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;color:var(--grey);text-transform:uppercase;margin-bottom:10px;}
  .panel-hint{font-size:11px;color:var(--grey);margin-bottom:10px;font-family:var(--font-mono);}
  .panel-loading{font-family:var(--font-mono);font-size:12px;color:var(--blue);padding:14px 0;text-align:center;}

  .matchup-table-wrap{overflow-x:auto;border:1.5px solid var(--ink);border-radius:4px;background:#fff;}
  table.matchup{border-collapse:collapse;width:100%;min-width:520px;font-size:12px;}
  table.matchup th, table.matchup td{padding:7px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap;}
  table.matchup th{font-family:var(--font-mono);font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--grey);background:var(--card);}
  table.matchup td:first-child, table.matchup th:first-child{text-align:left;font-weight:600;}
  table.matchup td.hot{color:var(--green);font-weight:700;}
  table.matchup td.cold{color:var(--red);}
  table.matchup tr:last-child td{border-bottom:none;}
  table.matchup tr.no-history{color:var(--grey);}
  .legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:11px;color:var(--grey);font-family:var(--font-mono);}
  .legend span{display:inline-flex;align-items:center;gap:4px;}
  .legend .dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
  .legend .dot.hot{background:var(--green);}
  .legend .dot.cold{background:var(--red);}

  footer{text-align:center;margin-top:32px;font-size:11px;color:var(--grey);font-family:var(--font-mono);letter-spacing:.04em;}
  footer .disclaimer{margin-top:8px;line-height:1.7;max-width:520px;margin-left:auto;margin-right:auto;}
  footer .author{margin-top:14px;font-size:11px;color:var(--ink);opacity:.7;}

  @media (max-width:460px){
    .pitcher-btn .pitcher-name{font-size:17px;}
    table.matchup{font-size:11px;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="eyebrow">MLB</div>
    <h1>今日<em>打者</em>VS先發投手</h1>
    <p class="sub">列出今天所有 MLB 賽事的先發投手，點選任一位投手，查看對方打者過去對戰他的生涯數據。</p>
  </header>

  <div class="lookup-card">
    <label class="lookup-label" for="batter-search">打者今日對戰查詢</label>
    <div class="name-search-row">
      <div class="name-search">
        <input type="text" id="batter-search" placeholder="輸入球員姓名，例如 Aaron Judge" autocomplete="off">
        <div class="suggest" id="batter-suggest"></div>
      </div>
      <button type="button" id="batter-reset" aria-label="清除查詢">Reset</button>
    </div>
    <div id="batter-result"></div>
  </div>

  <div class="datebar">
    <button type="button" id="prev-day" aria-label="前一天">‹</button>
    <input type="date" id="date-input">
    <button type="button" id="today-btn">今天</button>
    <button type="button" id="next-day" aria-label="後一天">›</button>
  </div>

  <div id="games-section"></div>

  <footer>
    <div>先發投手與打線來自 MLB Stats API · 對戰數據為生涯累積 · 打線於賽前約 2–3 小時公布</div>
    <div class="disclaimer">本站數據僅供參考，不保證即時或完全準確，實際先發與打線請以官方公告為準；
      內容與 MLB、MLB Advanced Media 官方無關，亦不構成任何投注或財務建議。</div>
    <div class="author">Built by Andy Huang</div>
  </footer>
</div>

<script>
  const gamesSection = document.getElementById('games-section');
  const dateInput = document.getElementById('date-input');

  function toDateStr(d){
    const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
    return y + '-' + m + '-' + day;
  }
  // 頁面的「日期」一律以瀏覽器所在時區（對你來說就是台灣時間）的日曆天為準，
  // 但 MLB Stats API 是以美東時間分賽程日的，所以查詢時可能要合併查詢美東前後兩天。
  function todayLocal(){
    return toDateStr(new Date());
  }
  function shiftDate(str, delta){
    const [y,m,d] = str.split('-').map(Number);
    const dt = new Date(Date.UTC(y, m-1, d));
    dt.setUTCDate(dt.getUTCDate() + delta);
    return toDateStr(new Date(dt.getUTCFullYear(), dt.getUTCMonth(), dt.getUTCDate()));
  }
  function etDateStrOf(date){
    const parts = new Intl.DateTimeFormat('en-CA', { timeZone: 'America/New_York', year:'numeric', month:'2-digit', day:'2-digit' }).formatToParts(date);
    const o = {}; parts.forEach(p => o[p.type] = p.value);
    return o.year + '-' + o.month + '-' + o.day;
  }
  // 抓出「本地（台灣）日曆天 dateStr」實際開打的所有比賽：
  // 因為時差，這一天可能橫跨美東的前後兩個賽程日，所以合併查詢後再依實際開打時間篩選。
  async function fetchGamesForLocalDay(dateStr){
    const [y,m,d] = dateStr.split('-').map(Number);
    const dayStart = new Date(y, m-1, d, 0, 0, 0, 0);
    const dayEnd = new Date(y, m-1, d+1, 0, 0, 0, 0);
    const etStart = etDateStrOf(dayStart);
    const etEnd = etDateStrOf(new Date(dayEnd.getTime() - 1));
    const etDates = etStart === etEnd ? [etStart] : [etStart, etEnd];

    const results = await Promise.all(etDates.map(d =>
      fetch('/api/mlb?path=schedule&sportId=1&date=' + d + '&hydrate=probablePitcher,team,linescore,lineups')
        .then(r => r.json())
    ));

    const seen = new Set();
    const games = [];
    results.forEach(data => {
      const day = data && data.dates && data.dates[0];
      ((day && day.games) || []).forEach(g => {
        if(seen.has(g.gamePk)) return;
        const gd = new Date(g.gameDate);
        if(gd >= dayStart && gd < dayEnd){
          seen.add(g.gamePk);
          games.push(g);
        }
      });
    });
    games.sort((a, b) => new Date(a.gameDate) - new Date(b.gameDate));
    return games;
  }

  let currentDate = todayLocal();
  dateInput.value = currentDate;

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str == null ? '' : String(str);
    return div.innerHTML;
  }

  function statusClass(state){
    const s = (state || '').toLowerCase();
    if(s.includes('final')) return 'final';
    if(s.includes('progress') || s.includes('live')) return 'live';
    return '';
  }

  function fmtTime(iso){
    try{
      return new Date(iso).toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });
    } catch(e){ return ''; }
  }
  function fmtTimeET(iso){
    try{
      return new Date(iso).toLocaleTimeString([], { hour:'2-digit', minute:'2-digit', timeZone:'America/New_York' });
    } catch(e){ return ''; }
  }

  async function loadGames(dateStr){
    gamesSection.innerHTML = '<div class="state-box"><div class="runway"><div class="ball">⚾</div></div>讀取今日賽程中…</div>';
    try{
      const games = await fetchGamesForLocalDay(dateStr);
      if(games.length === 0){
        gamesSection.innerHTML = '<div class="state-box">這一天沒有 MLB 賽事，換個日期看看吧。</div>';
        return;
      }
      renderGames(games);
    } catch(err){
      console.error('schedule error:', err);
      gamesSection.innerHTML = '<div class="state-box error">讀取賽程失敗：' + escapeHtml(err.message || '請稍後再試') +
        '<br><button type="button" id="retry-schedule">重新讀取</button></div>';
      document.getElementById('retry-schedule').addEventListener('click', () => loadGames(currentDate));
    }
  }

  function renderGames(games){
    gamesSection.innerHTML = '';
    games.forEach((game, idx) => {
      const away = game.teams && game.teams.away;
      const home = game.teams && game.teams.home;
      if(!away || !home) return;

      const card = document.createElement('div');
      card.className = 'game-card';

      const head = document.createElement('div');
      head.className = 'game-head';
      const statusText = (game.status && game.status.detailedState) || '';
      head.innerHTML =
        '<span>' + escapeHtml(fmtTime(game.gameDate)) + '　<span class="g-time-et">(ET ' + escapeHtml(fmtTimeET(game.gameDate)) + ')</span></span>' +
        '<span class="g-status ' + statusClass(statusText) + '">' + escapeHtml(statusText) + '</span>';
      card.appendChild(head);

      const row = document.createElement('div');
      row.className = 'matchup-row';
      row.appendChild(makePitcherBtn(away, home, game, idx, 'away'));
      const at = document.createElement('div'); at.className = 'at'; at.textContent = '@';
      row.appendChild(at);
      row.appendChild(makePitcherBtn(home, away, game, idx, 'home'));
      card.appendChild(row);

      const panelAway = document.createElement('div');
      panelAway.className = 'matchup-panel'; panelAway.style.display = 'none';
      panelAway.dataset.panel = 'away-' + idx;
      const panelHome = document.createElement('div');
      panelHome.className = 'matchup-panel'; panelHome.style.display = 'none';
      panelHome.dataset.panel = 'home-' + idx;
      card.appendChild(panelAway);
      card.appendChild(panelHome);

      gamesSection.appendChild(card);
    });
  }

  // side: 'away' 表示這位是「客隊」的先發投手，他面對的是主隊打線；反之亦然
  function makePitcherBtn(pitchingSide, battingSide, game, idx, side){
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'pitcher-btn';
    const pitcher = pitchingSide.probablePitcher;

    btn.innerHTML =
      '<span class="team-name">' + escapeHtml(pitchingSide.team.name) + ' 先發</span>' +
      '<span class="pitcher-name">' + (pitcher ? escapeHtml(pitcher.fullName) : '投手未公布') + '</span>' +
      '<span class="p-label">點選查看 ' + escapeHtml(battingSide.team.name) + ' 打者對戰數據</span>';

    if(!pitcher){
      btn.disabled = true;
      return btn;
    }

    btn.addEventListener('click', () => togglePanel(btn, game, idx, side, pitcher, battingSide));
    return btn;
  }

  async function togglePanel(btn, game, idx, side, pitcher, battingSide){
    const card = btn.closest('.game-card');
    const panel = card.querySelector('[data-panel="' + side + '-' + idx + '"]');
    const otherSide = side === 'away' ? 'home' : 'away';
    const otherPanel = card.querySelector('[data-panel="' + otherSide + '-' + idx + '"]');
    const otherBtn = card.querySelectorAll('.pitcher-btn')[side === 'away' ? 1 : 0];

    const isOpen = panel.style.display !== 'none';
    otherPanel.style.display = 'none';
    if(otherBtn) otherBtn.classList.remove('active');

    if(isOpen){
      panel.style.display = 'none';
      btn.classList.remove('active');
      return;
    }
    btn.classList.add('active');
    panel.style.display = 'block';

    if(panel.dataset.loaded === '1') return;
    panel.dataset.loaded = '1';
    panel.innerHTML = '<div class="panel-loading">讀取打線與對戰數據中…</div>';

    try{
      const batters = await getBatters(game, side, battingSide);
      if(batters.length === 0){
        panel.innerHTML = '<div class="panel-hint">目前查無 ' + escapeHtml(battingSide.team.name) + ' 的打者名單，請稍後再試。</div>';
        return;
      }
      const rows = await Promise.all(batters.map(b => fetchVsPlayer(b, pitcher.id)));
      renderMatchupTable(panel, pitcher, battingSide, rows, batters.some(b => b.fromRoster));
    } catch(err){
      console.error('matchup error:', err);
      panel.innerHTML = '<div class="panel-hint" style="color:var(--red)">讀取失敗：' + escapeHtml(err.message || '請再試一次') + '</div>';
    }
  }

  async function getBatters(game, side, battingSide){
    const lineups = game.lineups || {};
    const list = side === 'away' ? lineups.homePlayers : lineups.awayPlayers;
    if(list && list.length > 0){
      return list.map(p => ({ id: p.id, name: p.fullName, pos: (p.primaryPosition && p.primaryPosition.abbreviation) || '', fromRoster:false }));
    }
    // 打線尚未公布，退而求其次用該隊現役野手名單
    const teamId = battingSide.team.id;
    const res = await fetch('/api/mlb?path=teams/' + teamId + '/roster&rosterType=active');
    const data = await res.json();
    const roster = (data && data.roster) || [];
    return roster
      .filter(r => r.position && r.position.abbreviation !== 'P')
      .slice(0, 15)
      .map(r => ({ id: r.person.id, name: r.person.fullName, pos: r.position.abbreviation, fromRoster:true }));
  }

  async function fetchVsPlayer(batter, pitcherId){
    try{
      const res = await fetch('/api/mlb?path=people/' + batter.id + '/stats&stats=vsPlayerTotal&opposingPlayerId=' + pitcherId + '&group=hitting');
      const data = await res.json();
      const split = data && data.stats && data.stats[0] && data.stats[0].splits && data.stats[0].splits[0];
      return { batter, stat: split ? split.stat : null };
    } catch(e){
      return { batter, stat: null };
    }
  }

  function renderMatchupTable(panel, pitcher, battingSide, rows, isRosterFallback){
    rows.sort((a,b) => {
      const abA = a.stat ? Number(a.stat.atBats || 0) : -1;
      const abB = b.stat ? Number(b.stat.atBats || 0) : -1;
      return abB - abA;
    });

    let html = '<div class="panel-title">' + escapeHtml(battingSide.team.name) + ' 打者　VS　' + escapeHtml(pitcher.fullName) + '（生涯對戰）</div>';
    if(isRosterFallback){
      html += '<div class="panel-hint">打線尚未公布，以下先列出該隊現役野手；正式打線公布後請重新整理頁面。</div>';
    }
    html += '<div class="matchup-table-wrap"><table class="matchup"><thead><tr>' +
      '<th>打者</th><th>位置</th><th>打數</th><th>安打</th><th>全壘打</th><th>打點</th><th>三振</th><th>AVG</th><th>OPS</th>' +
      '</tr></thead><tbody>';

    rows.forEach(r => {
      const s = r.stat;
      const ab = s ? Number(s.atBats || 0) : 0;
      if(!s || ab === 0){
        html += '<tr class="no-history"><td>' + escapeHtml(r.batter.name) + '</td><td>' + escapeHtml(r.batter.pos) + '</td>' +
          '<td colspan="7">無生涯交手紀錄</td></tr>';
        return;
      }
      const avg = parseFloat(s.avg || '0');
      const ops = parseFloat(s.ops || '0');
      const hot = ab >= 5 && ops >= 0.850;
      const cold = ab >= 5 && ops <= 0.500;
      const cls = hot ? 'hot' : (cold ? 'cold' : '');
      html += '<tr>' +
        '<td>' + escapeHtml(r.batter.name) + '</td>' +
        '<td>' + escapeHtml(r.batter.pos) + '</td>' +
        '<td>' + ab + '</td>' +
        '<td>' + (s.hits || 0) + '</td>' +
        '<td>' + (s.homeRuns || 0) + '</td>' +
        '<td>' + (s.rbi || 0) + '</td>' +
        '<td>' + (s.strikeOuts || 0) + '</td>' +
        '<td class="' + cls + '">' + escapeHtml(s.avg || '—') + '</td>' +
        '<td class="' + cls + '">' + escapeHtml(s.ops || '—') + '</td>' +
        '</tr>';
    });

    html += '</tbody></table></div>' +
      '<div class="legend"><span><span class="dot hot"></span>對戰打數≥5 且 OPS≥.850（打者佔優）</span>' +
      '<span><span class="dot cold"></span>對戰打數≥5 且 OPS≤.500（投手壓制）</span></div>';

    panel.innerHTML = html;
  }

  // ---------- 打者今日對戰查詢（固定查「今天」＝你所在時區的今天，不受下方日期切換影響） ----------
  let todayGamesPromise = null;
  function getTodayGames(){
    if(!todayGamesPromise){
      todayGamesPromise = fetchGamesForLocalDay(todayLocal()).catch(() => []);
    }
    return todayGamesPromise;
  }

  const batterSearchInput = document.getElementById('batter-search');
  const batterSuggestBox = document.getElementById('batter-suggest');
  const batterResultEl = document.getElementById('batter-result');
  let batterSearchTimer = null;

  batterSearchInput.addEventListener('input', () => {
    if(batterSearchTimer) clearTimeout(batterSearchTimer);
    const q = batterSearchInput.value.trim();
    if(q.length < 2){ batterSuggestBox.classList.remove('active'); batterSuggestBox.innerHTML = ''; return; }
    batterSearchTimer = setTimeout(() => searchBatters(q), 350);
  });
  batterSearchInput.addEventListener('blur', () => setTimeout(() => batterSuggestBox.classList.remove('active'), 200));

  document.getElementById('batter-reset').addEventListener('click', () => {
    if(batterSearchTimer) clearTimeout(batterSearchTimer);
    batterSearchInput.value = '';
    batterSuggestBox.classList.remove('active');
    batterSuggestBox.innerHTML = '';
    batterResultEl.innerHTML = '';
    batterSearchInput.focus();
  });

  async function searchBatters(q){
    try{
      const res = await fetch('/api/mlb?path=people/search&names=' + encodeURIComponent(q));
      const data = await res.json();
      const people = ((data && data.people) || [])
        .filter(p => p.isPlayer !== false && (!p.primaryPosition || p.primaryPosition.abbreviation !== 'P'))
        .sort((a,b) => (b.active === true) - (a.active === true))
        .slice(0, 8);
      batterSuggestBox.innerHTML = '';
      if(people.length === 0){ batterSuggestBox.classList.remove('active'); return; }
      people.forEach(p => {
        const el = document.createElement('div');
        el.className = 'suggest-item';
        const posAbbr = (p.primaryPosition && p.primaryPosition.abbreviation) || '?';
        el.innerHTML = '<span>' + escapeHtml(p.fullName) + '</span><span class="s-pos">' + escapeHtml(posAbbr) + (p.active ? '' : ' · 非現役') + '</span>';
        el.addEventListener('mousedown', e => { e.preventDefault(); pickBatter(p); });
        batterSuggestBox.appendChild(el);
      });
      batterSuggestBox.classList.add('active');
    } catch(e){ /* 搜尋失敗就靜默略過 */ }
  }

  async function pickBatter(person){
    batterSearchInput.value = person.fullName;
    batterSuggestBox.classList.remove('active');
    batterSuggestBox.innerHTML = '';
    batterResultEl.innerHTML = '<div class="panel-loading">查詢今日對戰中…</div>';

    try{
      const detailRes = await fetch('/api/mlb?path=people/' + person.id + '&hydrate=currentTeam');
      const detailData = await detailRes.json();
      const detail = detailData && detailData.people && detailData.people[0];
      const team = detail && detail.currentTeam;
      if(!team){
        batterResultEl.innerHTML = '<div class="panel-hint">查不到 ' + escapeHtml(person.fullName) + ' 目前效力的球隊。</div>';
        return;
      }

      const games = await getTodayGames();
      const game = games.find(g => g.teams.home.team.id === team.id || g.teams.away.team.id === team.id);
      if(!game){
        batterResultEl.innerHTML = '<div class="panel-hint">' + escapeHtml(team.name) + '（' + escapeHtml(person.fullName) + ' 所屬球隊）今天沒有比賽。</div>';
        return;
      }

      const isHome = game.teams.home.team.id === team.id;
      const oppSide = isHome ? game.teams.away : game.teams.home;
      const pitcher = oppSide.probablePitcher;
      if(!pitcher){
        batterResultEl.innerHTML = '<div class="panel-hint">今天對戰 ' + escapeHtml(oppSide.team.name) + '，但先發投手尚未公布，請稍後再查。</div>';
        return;
      }

      const posAbbr = (person.primaryPosition && person.primaryPosition.abbreviation) || '';
      const r = await fetchVsPlayer({ id: person.id, name: person.fullName, pos: posAbbr }, pitcher.id);
      renderBatterResult(person, team, oppSide, pitcher, r);
    } catch(err){
      console.error('batter lookup error:', err);
      batterResultEl.innerHTML = '<div class="panel-hint" style="color:var(--red)">查詢失敗：' + escapeHtml(err.message || '請再試一次') + '</div>';
    }
  }

  function renderBatterResult(person, team, oppSide, pitcher, r){
    let html = '<div class="batter-result-head">今日賽事：' + escapeHtml(team.name) + '　vs　' + escapeHtml(oppSide.team.name) + '</div>';

    const s = r.stat;
    const ab = s ? Number(s.atBats || 0) : 0;

    html += '<div class="matchup-table-wrap"><table class="matchup"><thead><tr>' +
      '<th>打者</th><th>投手</th><th>打數</th><th>安打</th><th>全壘打</th><th>打點</th><th>三振</th><th>AVG</th><th>OPS</th>' +
      '</tr></thead><tbody>';

    if(!s || ab === 0){
      html += '<tr class="no-history"><td>' + escapeHtml(person.fullName) + '</td><td>' + escapeHtml(pitcher.fullName) + '</td><td colspan="7">無生涯交手紀錄</td></tr>';
    } else {
      const ops = parseFloat(s.ops || '0');
      const hot = ab >= 5 && ops >= 0.850;
      const cold = ab >= 5 && ops <= 0.500;
      const cls = hot ? 'hot' : (cold ? 'cold' : '');
      html += '<tr>' +
        '<td>' + escapeHtml(person.fullName) + '</td>' +
        '<td>' + escapeHtml(pitcher.fullName) + '</td>' +
        '<td>' + ab + '</td>' +
        '<td>' + (s.hits || 0) + '</td>' +
        '<td>' + (s.homeRuns || 0) + '</td>' +
        '<td>' + (s.rbi || 0) + '</td>' +
        '<td>' + (s.strikeOuts || 0) + '</td>' +
        '<td class="' + cls + '">' + escapeHtml(s.avg || '—') + '</td>' +
        '<td class="' + cls + '">' + escapeHtml(s.ops || '—') + '</td>' +
        '</tr>';
    }
    html += '</tbody></table></div>' +
      '<div class="legend"><span><span class="dot hot"></span>打數≥5 且 OPS≥.850（打者佔優）</span>' +
      '<span><span class="dot cold"></span>打數≥5 且 OPS≤.500（投手壓制）</span></div>';

    batterResultEl.innerHTML = html;
  }

  document.getElementById('prev-day').addEventListener('click', () => {
    currentDate = shiftDate(currentDate, -1);
    dateInput.value = currentDate;
    loadGames(currentDate);
  });
  document.getElementById('next-day').addEventListener('click', () => {
    currentDate = shiftDate(currentDate, 1);
    dateInput.value = currentDate;
    loadGames(currentDate);
  });
  document.getElementById('today-btn').addEventListener('click', () => {
    currentDate = todayLocal();
    dateInput.value = currentDate;
    loadGames(currentDate);
  });
  dateInput.addEventListener('change', () => {
    if(dateInput.value){ currentDate = dateInput.value; loadGames(currentDate); }
  });

  loadGames(currentDate);
</script>
</body>
</html>
